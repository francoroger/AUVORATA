<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="atelier-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0805"/>
            <stop offset="40%" stop-color="#1a1208"/>
            <stop offset="65%" stop-color="#4a2f10"/>
            <stop offset="85%" stop-color="#a67838"/>
            <stop offset="100%" stop-color="#e8c878"/>
        </linearGradient>

        <radialGradient id="atelier-glow" cx="75%" cy="80%" r="60%">
            <stop offset="0%" stop-color="#fbe9a8" stop-opacity="0.5"/>
            <stop offset="40%" stop-color="#d4af5c" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="atelier-glow-2" cx="20%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#e8c878" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <filter id="grain">
            <feTurbulence baseFrequency="0.9" numOctaves="3" seed="5"/>
            <feColorMatrix values="0 0 0 0 0.8 0 0 0 0 0.65 0 0 0 0 0.35 0 0 0 0.06 0"/>
            <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
    </defs>

    <!-- gradiente principal -->
    <rect width="1600" height="900" fill="url(#atelier-bg)"/>

    <!-- camadas de glow -->
    <rect width="1600" height="900" fill="url(#atelier-glow)"/>
    <rect width="1600" height="900" fill="url(#atelier-glow-2)"/>

    <!-- linhas suaves sugerindo textura/movimento de ouro líquido -->
    <g opacity="0.15" stroke="#fbe9a8" fill="none" stroke-width="0.5">
        <path d="M 0 600 Q 400 580 800 620 T 1600 600"/>
        <path d="M 0 650 Q 400 630 800 670 T 1600 650"/>
        <path d="M 0 700 Q 400 680 800 720 T 1600 700"/>
        <path d="M 0 750 Q 400 730 800 770 T 1600 750"/>
    </g>

    <!-- partículas/poeira dourada -->
    <g fill="#fbe9a8">
        <circle cx="200" cy="200" r="1" opacity="0.5"/>
        <circle cx="400" cy="150" r="0.8" opacity="0.4"/>
        <circle cx="700" cy="250" r="1.2" opacity="0.6"/>
        <circle cx="900" cy="180" r="0.7" opacity="0.3"/>
        <circle cx="1100" cy="280" r="1.4" opacity="0.7"/>
        <circle cx="1300" cy="180" r="1" opacity="0.5"/>
        <circle cx="350" cy="450" r="0.8" opacity="0.4"/>
        <circle cx="800" cy="400" r="1.1" opacity="0.5"/>
        <circle cx="1200" cy="500" r="0.9" opacity="0.4"/>
        <circle cx="150" cy="700" r="1" opacity="0.6"/>
        <circle cx="550" cy="780" r="1.3" opacity="0.7"/>
        <circle cx="1050" cy="800" r="1" opacity="0.5"/>
    </g>

    <!-- ruído sutil -->
    <rect width="1600" height="900" filter="url(#grain)" opacity="0.4"/>
</svg>
