<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
        <radialGradient id="bg-origem" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#1c1812"/>
            <stop offset="50%" stop-color="#0c0805"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <radialGradient id="gold-drop" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fbe9a8"/>
            <stop offset="30%" stop-color="#e8c878"/>
            <stop offset="65%" stop-color="#a67838"/>
            <stop offset="100%" stop-color="#3a2410"/>
        </radialGradient>

        <radialGradient id="gem-deep" cx="40%" cy="35%" r="60%">
            <stop offset="0%" stop-color="#fff8e0"/>
            <stop offset="40%" stop-color="#d4af5c"/>
            <stop offset="80%" stop-color="#6b4318"/>
            <stop offset="100%" stop-color="#1a0f05"/>
        </radialGradient>

        <linearGradient id="thread" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbe9a8" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#8a5e22" stop-opacity="0.4"/>
        </linearGradient>

        <filter id="piece-glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="800" height="1000" fill="url(#bg-origem)"/>

    <!-- halo central -->
    <circle cx="400" cy="500" r="350" fill="#d4af5c" opacity="0.05"/>
    <circle cx="400" cy="500" r="220" fill="#d4af5c" opacity="0.07"/>

    <!-- fio que segura o brinco -->
    <line x1="400" y1="100" x2="400" y2="280" stroke="url(#thread)" stroke-width="1.5"/>

    <!-- argola/gancho -->
    <path d="M 400 100 Q 410 90 410 80 Q 410 70 400 70 Q 390 70 390 80 Q 390 90 400 100"
          stroke="#d4af5c" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- A peça principal: gota dourada esculpida com gema interna -->
    <g transform="translate(400, 450)" filter="url(#piece-glow)">
        <!-- forma de gota (lágrima) -->
        <path d="M 0 -180
                 C 80 -160, 130 -80, 130 30
                 C 130 130, 70 180, 0 180
                 C -70 180, -130 130, -130 30
                 C -130 -80, -80 -160, 0 -180 Z"
              fill="url(#gold-drop)"/>

        <!-- borda definida da peça -->
        <path d="M 0 -180
                 C 80 -160, 130 -80, 130 30
                 C 130 130, 70 180, 0 180
                 C -70 180, -130 130, -130 30
                 C -130 -80, -80 -160, 0 -180 Z"
              fill="none" stroke="#fbe9a8" stroke-width="1" opacity="0.4"/>

        <!-- reflexo de luz na lateral esquerda -->
        <path d="M -100 -100 Q -120 -20 -100 80"
              stroke="#fbe9a8" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>

        <!-- sombra na lateral direita -->
        <path d="M 100 -80 Q 115 30 95 130"
              stroke="#3a2410" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round"/>

        <!-- pedra/gema central oval -->
        <ellipse cx="0" cy="20" rx="55" ry="80" fill="url(#gem-deep)"/>

        <!-- facetas da gema -->
        <path d="M 0 -55 L 45 -10 L 30 60 L -30 60 L -45 -10 Z"
              fill="#fff8e0" opacity="0.25"/>

        <!-- brilho na gema -->
        <ellipse cx="-15" cy="-15" rx="15" ry="22" fill="#ffffff" opacity="0.4" transform="rotate(-25 -15 -15)"/>

        <!-- borda da pedra -->
        <ellipse cx="0" cy="20" rx="55" ry="80" fill="none" stroke="#fbe9a8" stroke-width="1.5" opacity="0.6"/>

        <!-- detalhes gravados na moldura (4 pontos cardeais) -->
        <g fill="#3a2410" opacity="0.7">
            <circle cx="0" cy="-120" r="4"/>
            <circle cx="0" cy="155" r="4"/>
            <circle cx="-95" cy="20" r="3"/>
            <circle cx="95" cy="20" r="3"/>
        </g>
    </g>

    <!-- sombra/reflexo abaixo da peça -->
    <ellipse cx="400" cy="680" rx="130" ry="12" fill="#000" opacity="0.6"/>
    <ellipse cx="400" cy="680" rx="100" ry="6" fill="#d4af5c" opacity="0.1"/>

    <!-- partículas -->
    <g fill="#fbe9a8" opacity="0.35">
        <circle cx="180" cy="300" r="1"/>
        <circle cx="620" cy="350" r="1.2"/>
        <circle cx="700" cy="600" r="0.8"/>
        <circle cx="150" cy="700" r="1"/>
        <circle cx="600" cy="800" r="1.4"/>
    </g>
</svg>
