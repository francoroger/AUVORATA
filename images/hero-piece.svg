<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
    <defs>
        <radialGradient id="hero-bg" cx="60%" cy="40%" r="80%">
            <stop offset="0%" stop-color="#2a1f12"/>
            <stop offset="30%" stop-color="#15100a"/>
            <stop offset="70%" stop-color="#080604"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <radialGradient id="hero-light" cx="65%" cy="35%" r="40%">
            <stop offset="0%" stop-color="#fbe9a8" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#d4af5c" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="ring-gold" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffefc4"/>
            <stop offset="20%" stop-color="#fbe9a8"/>
            <stop offset="45%" stop-color="#e8c878"/>
            <stop offset="70%" stop-color="#a67838"/>
            <stop offset="90%" stop-color="#5a3818"/>
            <stop offset="100%" stop-color="#2a1808"/>
        </radialGradient>

        <radialGradient id="ring-inner" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1a0f08"/>
            <stop offset="70%" stop-color="#0a0604"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <filter id="hero-blur-bg">
            <feGaussianBlur stdDeviation="1.5"/>
        </filter>

        <filter id="depth-shadow">
            <feGaussianBlur stdDeviation="20"/>
        </filter>
    </defs>

    <!-- fundo -->
    <rect width="900" height="1200" fill="url(#hero-bg)"/>
    <rect width="900" height="1200" fill="url(#hero-light)"/>

    <!-- partículas de fundo (poeira em foco macro) -->
    <g fill="#fbe9a8" opacity="0.25" filter="url(#hero-blur-bg)">
        <circle cx="150" cy="200" r="3"/>
        <circle cx="780" cy="180" r="2"/>
        <circle cx="100" cy="450" r="4"/>
        <circle cx="820" cy="500" r="2.5"/>
        <circle cx="200" cy="900" r="3"/>
        <circle cx="700" cy="950" r="2"/>
    </g>

    <!-- sombra de profundidade -->
    <ellipse cx="450" cy="850" rx="280" ry="40" fill="#000" opacity="0.85" filter="url(#depth-shadow)"/>

    <!-- ANEL hero — close macro, ângulo de 3/4 -->
    <g transform="translate(450, 600)">
        <!-- banda principal (elipse de perspectiva) -->
        <ellipse cx="0" cy="0" rx="280" ry="280" fill="url(#ring-gold)"/>

        <!-- vão interno -->
        <ellipse cx="0" cy="0" rx="195" ry="195" fill="url(#ring-inner)"/>

        <!-- reflexos de luz na banda (acentuam volume) -->
        <path d="M -240 -80 Q -250 -220 -80 -270"
              stroke="#ffefc4" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
        <path d="M -260 60 Q -240 180 -120 250"
              stroke="#fbe9a8" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
        <path d="M 100 -260 Q 240 -220 270 -50"
              stroke="#ffefc4" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>

        <!-- sombra interna na banda direita -->
        <path d="M 250 80 Q 240 180 130 250"
              stroke="#2a1808" stroke-width="14" fill="none" opacity="0.5" stroke-linecap="round"/>

        <!-- detalhe gravado: SOL NASCENTE no topo -->
        <g transform="translate(0, -240)">
            <g stroke="#5a3818" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85">
                <line x1="0" y1="-35" x2="0" y2="-15"/>
                <line x1="-12" y1="-30" x2="-9" y2="-13"/>
                <line x1="12" y1="-30" x2="9" y2="-13"/>
                <line x1="-22" y1="-22" x2="-17" y2="-10"/>
                <line x1="22" y1="-22" x2="17" y2="-10"/>
                <line x1="-30" y1="-10" x2="-23" y2="-3"/>
                <line x1="30" y1="-10" x2="23" y2="-3"/>
                <path d="M -28 8 A 28 28 0 0 1 28 8"/>
                <line x1="-38" y1="8" x2="38" y2="8"/>
            </g>
            <!-- highlight na gravação -->
            <g stroke="#fbe9a8" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.5">
                <line x1="-0.5" y1="-35" x2="-0.5" y2="-15"/>
                <path d="M -28 7 A 28 28 0 0 1 28 7"/>
            </g>
        </g>

        <!-- pedra/cristal central minúsculo -->
        <g transform="translate(0, 0)">
            <polygon points="0,-15 10,-10 14,0 10,10 0,15 -10,10 -14,0 -10,-10"
                     fill="#ffffff" opacity="0.7"/>
        </g>
    </g>

    <!-- vinheta sutil -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <rect width="900" height="1200" fill="url(#vignette)"/>
</svg>
