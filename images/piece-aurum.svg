<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
        <radialGradient id="bg-aurum" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#1c1610"/>
            <stop offset="50%" stop-color="#0a0805"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <linearGradient id="chain-link" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbe9a8"/>
            <stop offset="35%" stop-color="#e8c878"/>
            <stop offset="65%" stop-color="#a67838"/>
            <stop offset="100%" stop-color="#4a2f10"/>
        </linearGradient>

        <linearGradient id="chain-link-2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8a5e22"/>
            <stop offset="50%" stop-color="#c89548"/>
            <stop offset="100%" stop-color="#fbe9a8"/>
        </linearGradient>

        <radialGradient id="charm" cx="40%" cy="35%" r="60%">
            <stop offset="0%" stop-color="#fbe9a8"/>
            <stop offset="40%" stop-color="#e8c878"/>
            <stop offset="80%" stop-color="#a67838"/>
            <stop offset="100%" stop-color="#5a3818"/>
        </radialGradient>

        <filter id="chain-glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="800" height="1000" fill="url(#bg-aurum)"/>

    <!-- nuvem de luz dourada no topo -->
    <ellipse cx="400" cy="100" rx="500" ry="200" fill="#d4af5c" opacity="0.08"/>

    <!-- a corrente desce em curva graciosa -->
    <g filter="url(#chain-glow)">
        <!-- elos da corrente -->
        <g fill="none" stroke-width="14" stroke-linecap="round">
            <!-- cada elo é um pequeno oval -->
            <ellipse cx="280" cy="180" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(-15 280 180)"/>
            <ellipse cx="305" cy="220" rx="22" ry="14" stroke="url(#chain-link-2)" transform="rotate(75 305 220)"/>
            <ellipse cx="330" cy="260" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(-15 330 260)"/>
            <ellipse cx="355" cy="300" rx="22" ry="14" stroke="url(#chain-link-2)" transform="rotate(75 355 300)"/>
            <ellipse cx="380" cy="340" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(-15 380 340)"/>
            <ellipse cx="405" cy="380" rx="22" ry="14" stroke="url(#chain-link-2)" transform="rotate(75 405 380)"/>
            <ellipse cx="425" cy="420" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(-10 425 420)"/>
            <ellipse cx="440" cy="465" rx="22" ry="14" stroke="url(#chain-link-2)" transform="rotate(80 440 465)"/>
            <ellipse cx="448" cy="510" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(-5 448 510)"/>
            <ellipse cx="450" cy="555" rx="22" ry="14" stroke="url(#chain-link-2)" transform="rotate(85 450 555)"/>
            <ellipse cx="448" cy="600" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(0 448 600)"/>
            <ellipse cx="440" cy="645" rx="22" ry="14" stroke="url(#chain-link-2)" transform="rotate(80 440 645)"/>
            <ellipse cx="425" cy="690" rx="22" ry="14" stroke="url(#chain-link)" transform="rotate(15 425 690)"/>
        </g>
    </g>

    <!-- pingente: disco dourado com gravação do sol -->
    <g transform="translate(420, 770)">
        <!-- argola que conecta ao último elo -->
        <ellipse cx="0" cy="-60" rx="14" ry="10" stroke="url(#chain-link)" stroke-width="5" fill="none"/>

        <!-- disco do pingente -->
        <circle cx="0" cy="0" r="75" fill="url(#charm)"/>
        <circle cx="0" cy="0" r="75" fill="none" stroke="#fbe9a8" stroke-width="1" opacity="0.4"/>

        <!-- destaque de luz -->
        <ellipse cx="-25" cy="-25" rx="22" ry="14" fill="#ffffff" opacity="0.3" transform="rotate(-30 -25 -25)"/>

        <!-- gravação central: sol nascente em baixo relevo -->
        <g stroke="#3a2410" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7">
            <line x1="0" y1="-35" x2="0" y2="-15"/>
            <line x1="-10" y1="-30" x2="-7" y2="-13"/>
            <line x1="10" y1="-30" x2="7" y2="-13"/>
            <line x1="-20" y1="-22" x2="-15" y2="-10"/>
            <line x1="20" y1="-22" x2="15" y2="-10"/>
            <line x1="-28" y1="-10" x2="-22" y2="-3"/>
            <line x1="28" y1="-10" x2="22" y2="-3"/>
            <path d="M -25 8 A 25 25 0 0 1 25 8"/>
            <line x1="-32" y1="8" x2="32" y2="8"/>
        </g>
    </g>

    <!-- sombra sob o pingente -->
    <ellipse cx="420" cy="860" rx="80" ry="8" fill="#000" opacity="0.6"/>

    <!-- partículas -->
    <g fill="#fbe9a8" opacity="0.3">
        <circle cx="150" cy="350" r="1"/>
        <circle cx="650" cy="500" r="1.3"/>
        <circle cx="600" cy="200" r="0.8"/>
        <circle cx="200" cy="650" r="1"/>
    </g>
</svg>
